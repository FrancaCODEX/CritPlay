spring.application.name=critplay
spring.config.import=optional:file:./.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/gameshelf
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
ggdeals.api-key=${GGDEALS_API_KEY:}
ggdeals.region=br
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.admin.username=${CRITPLAY_ADMIN_USERNAME:${GAMESHELF_ADMIN_USERNAME:}}
app.admin.password=${CRITPLAY_ADMIN_PASSWORD:${GAMESHELF_ADMIN_PASSWORD:}}
app.admin.display-name=${CRITPLAY_ADMIN_NAME:${GAMESHELF_ADMIN_NAME:Administrador}}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.media.directory=${CRITPLAY_MEDIA_DIRECTORY:${GAMESHELF_MEDIA_DIRECTORY:./data/uploads}}
app.security.rate-limit-enabled=${RATE_LIMIT_ENABLED:true}
app.recovery.enabled=${RECOVERY_ENABLED:false}
app.recovery.base-url=${APP_BASE_URL:http://localhost:8080}
app.recovery.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Metadados: chave RAWG gratuita para uso pessoal, separada do GG.deals.
rawg.api-key=${RAWG_API_KEY:}

# Carga fictícia opcional, executada uma única vez por banco.
app.demo.enabled=${DEMO_DATA_ENABLED:false}
app.demo.game-titles=${DEMO_GAME_TITLES:}
