spring.application.name=gameshelf
spring.config.import=optional:file:./.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/gameshelf
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
ggdeals.api-key=${GGDEALS_API_KEY:}
ggdeals.region=br
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.admin.username=${GAMESHELF_ADMIN_USERNAME:}
app.admin.password=${GAMESHELF_ADMIN_PASSWORD:}
app.admin.display-name=${GAMESHELF_ADMIN_NAME:Administrador}
spring.jackson.deserialization.fail-on-unknown-properties=true
