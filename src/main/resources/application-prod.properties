spring.config.import=
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=5s
spring.flyway.baseline-on-migrate=false
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.tracking-modes=cookie
# Production receives traffic exclusively through the hosting platform's TLS proxy.
server.forward-headers-strategy=framework
app.media.storage=database
app.media.directory=/tmp/critplay-uploads
app.catalog.seed-enabled=false
app.demo.enabled=false
spring.session.jdbc.cleanup-cron=0 0 3 * * *
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.com.zaxxer.hikari=ERROR
