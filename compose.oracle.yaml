name: critplay-oracle

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: critplay
      POSTGRES_USER: critplay
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD em .env.oracle}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    logging: *logging

  app:
    build: .
    image: critplay:oracle
    restart: unless-stopped
    init: true
    env_file: .env.oracle
    environment:
      SPRING_PROFILES_ACTIVE: postgres,oracle
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/critplay
      DB_USERNAME: critplay
      DB_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD em .env.oracle}
      SESSION_COOKIE_SECURE: 'true'
      APP_BASE_URL: https://${CRITPLAY_DOMAIN:?Preencha CRITPLAY_DOMAIN em .env.oracle}
      CRITPLAY_MEDIA_DIRECTORY: /app/data/uploads
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError'
    volumes:
      - uploads:/app/data
    networks: [database, proxy]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/api/health']
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5
    mem_limit: 2g
    stop_grace_period: 40s
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CRITPLAY_DOMAIN: ${CRITPLAY_DOMAIN:?Preencha CRITPLAY_DOMAIN em .env.oracle}
      ACME_EMAIL: ${ACME_EMAIL:?Preencha ACME_EMAIL em .env.oracle}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      proxy:
        ipv4_address: 172.30.10.10
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging

networks:
  database:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
