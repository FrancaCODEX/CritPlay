name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: critplay
          POSTGRES_USER: critplay
          POSTGRES_PASSWORD: critplay-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U critplay -d critplay"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES: 'true'
      DB_URL: jdbc:postgresql://localhost:5432/critplay
      DB_USERNAME: critplay
      DB_PASSWORD: critplay-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testar e empacotar
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify
      - name: Verificar interface no navegador
        run: |
          npm install --prefix "$RUNNER_TEMP/critplay-ui" playwright@1.58.2 --no-audit --no-fund
          node "$RUNNER_TEMP/critplay-ui/node_modules/playwright/cli.js" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/critplay-ui/node_modules" node tests/reviews-ui.cjs
          NODE_PATH="$RUNNER_TEMP/critplay-ui/node_modules" node tests/browser-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/critplay-ui/node_modules" node tests/community-browser.cjs
