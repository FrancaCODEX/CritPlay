services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Informe o nome real do banco em DB_NAME}
      POSTGRES_USER: ${DB_USERNAME:-critplay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env antes de iniciar PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - critplay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  critplay-postgres:
    name: ${POSTGRES_VOLUME_NAME:?Informe o volume persistente em POSTGRES_VOLUME_NAME antes de iniciar}
